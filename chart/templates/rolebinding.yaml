apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "events-presenter.fullname" . }}-events
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "events-presenter.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "events-presenter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "events-presenter.fullname" . }}-events
  apiGroup: rbac.authorization.k8s.io
