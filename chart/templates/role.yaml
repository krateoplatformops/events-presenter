apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "events-presenter.fullname" . }}-events
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "events-presenter.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]
