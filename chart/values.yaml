namespace: demo-system
name: events-presenter

replicas: 1

image:
  repository: ghcr.io/krateoplatformops/events-presenter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automount: true

service:
  port: 8084

config:
  DEBUG: "false"
  DB_READY_TIMEOUT: "2m"
  PORT: "8084"
  NAMESPACES: "demo-system"

secret:
  create: false
  name: eventrouter-db

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 15

