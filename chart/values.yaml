name: events-presenter

replicas: 1

image:
  repository: ghcr.io/krateoplatformops/events-presenter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automount: true

service:
  port: 8084

config:
  DEBUG: "false"
  DB_READY_TIMEOUT: "2m"

secret:
  create: false
  name: eventrouter-db

ingress:
  enabled: false
  className: "nginx"
  annotations: 
    # Ingress class già specificata con className
    # TLS automatico via cert-manager se attivo
    kubernetes.io/tls-acme: "true"
    # Timeout per SSE / streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
    
  hosts:
    - host: events-presenter.example.com
      paths:
        - path: /notifications
          pathType: Prefix
        - path: /events
          pathType: Prefix

  tls:
    - secretName: events-presenter-tls
      hosts:
        - events-presenter.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 15

