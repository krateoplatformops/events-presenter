name: events-presenter

replicas: 1

image:
  repository: ghcr.io/krateoplatformops/events-presenter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automount: true

service:
  port: 8084

config:
  # Enable or disable debug logging
  DEBUG: "false"

  # Maximum time to wait for PostgreSQL to become ready
  DB_READY_TIMEOUT: "4m"

  # Database username
  # DB_USER: ""

  # Database password (prefer using a Secret)
  # DB_PASS: ""

  # Database host
  # DB_HOST: "localhost"

  # PostgreSQL port
  # DB_PORT: "5432"

  # Extra query parameters (e.g. sslmode=disable&connect_timeout=5)
  # DB_PARAMS: ""       


# Optional Secret containing DB credentials
secret:
  create: false
  name: eventrouter-db

ingress:
  enabled: false
  className: "nginx"
  annotations: 
    # Ingress class già specificata con className
    # TLS automatico via cert-manager se attivo
    kubernetes.io/tls-acme: "true"
    # Timeout per SSE / streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
    
  hosts:
    - host: events-presenter.example.com
      paths:
        - path: /notifications
          pathType: Prefix
        - path: /events
          pathType: Prefix

  tls:
    - secretName: events-presenter-tls
      hosts:
        - events-presenter.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 45
    periodSeconds: 90
  liveness:
    path: /livez
    initialDelaySeconds: 45
    periodSeconds: 90
