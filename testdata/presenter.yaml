apiVersion: v1
kind: Namespace
metadata:
  name: demo-system
---
# ---------------------------------------------------------
# SERVICE ACCOUNT
# ---------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: presenter
  namespace: demo-system
---
apiVersion: v1
kind: Service
metadata:
  name: presenter
  namespace: demo-system
spec:
  type: NodePort
  selector:
    app: presenter
  ports:
    - protocol: TCP
      port: 8084        
      targetPort: 8084  
      nodePort: 30084
---
# -----------------------------
# DEPLOYMENT: presenter
# -----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presenter
  namespace: demo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presenter
  template:
    metadata:
      labels:
        app: presenter
    spec:
      serviceAccountName: presenter
      containers:
        - name: presenter
          image: kind.local/presenter:latest
          imagePullPolicy: Never
          env:
            - name: DEBUG
              value: "true"
            - name: DB_URL
              value: "postgres://test:test@postgres.demo-system.svc.cluster.local:5432/testdb?sslmode=disable"
            - name: DB_READY_TIMEOUT
              value: "2m"
            - name: PORT
              value: "8084"

          ports:
            - name: http
              containerPort: 8084

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
